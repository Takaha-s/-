<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>家具配置・衝突検知AR（修正版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- ① 衝突検知に必要な Three.js を確実に先に読み込む -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- ② Model-viewer ライブラリ -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
      body { margin: 0; font-family: sans-serif; }
      model-viewer { width: 100vw; height: 100vh; }
      .btn-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 999;
      }
      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      #ar-button { background: #3182ce; color: white; }
      #check-button { background: #e53e3e; color: white; display: none; }
    </style>
  </head>
  <body>

    <!--
      ARモードに入ってもサイズを固定するために：
      1. scale="0.3 0.3 0.3" でミニチュア化
      2. ar-scale="fixed" を追加（これでARモード内でも3割のサイズのまま固定されます！）
    -->
    <model-viewer 
      id="viewer"
      src="furniture.glb" 
      scale="0.3 0.3 0.3"
      ar-scale="fixed"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="none"
      alt="家具と動線バリア">
      
      <div class="btn-container">
        <button id="check-button" onclick="checkCollision()">⚠️ 配置エリアの安全確認</button>
        <button id="ar-button" slot="ar-button">部屋に家具を配置する</button>
      </div>

    </model-viewer>

    <script>
      const viewer = document.getElementById('viewer');
      const checkBtn = document.getElementById('check-button');

      // ARモードで床にオブジェクトが置かれたらボタンを表示
      viewer.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'object-placed') {
          checkBtn.style.display = 'block';
        }
      });

      // 衝突検知のロジック
      function checkCollision() {
        try {
          // model-viewerの内部3Dシーンにアクセス
          const model3D = viewer.model.toObject3D();
          
          // メッシュ（箱などの立体）をすべて取得
          const meshes = [];
          model3D.traverse((child) => {
            if (child.isMesh) {
              meshes.push(child);
            }
          });

          // 正しく3Dオブジェクトが認識できているか検証
          if (meshes.length >= 2) {
            // Three.jsのBox3を使って境界ボックスを計算
            const box1 = new THREE.Box3().setFromObject(meshes[0]);
            const box2 = new THREE.Box3().setFromObject(meshes[1]);

            // ここで実際に、家具本体とバリアが干渉しているかを計算
            // intersectsBoxは２つの箱が重なっているかを判定するThree.jsの標準関数です
            const isColliding = box1.intersectsBox(box2);

            // ※現在は同じglbファイル内に家具とバリアが最初から隣接（または接触）して入っているため、
            // 設計上「衝突している」と判定される可能性があります。
            if (isColliding) {
              alert("【生活動線シミュレーション結果】\n\n⚠️ 警告：家具の周囲に十分な生活スペースが確保できていません！\n家具が他のオブジェクトや壁に干渉している、または動線（赤いエリア）に障害物があります。");
            } else {
              alert("【生活動線シミュレーション結果】\n\n🎉 クリア：家具の周囲に十分な生活動線が確保されています！");
            }
          } else {
            alert("3Dオブジェクトを読み込み中です。もう一度ボタンを押してください。");
          }
        } catch (error) {
          console.error(error);
          alert("検証エラーが発生しました。\n詳細：" + error.message);
        }
      }
    </script>
  </body>
</html>
