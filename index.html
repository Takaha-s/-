<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>家具配置・衝突検知AR（縮小モデル版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      model-viewer { width: 100vw; height: 100vh; }
      .btn-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 999;
      }
      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      #ar-button { background: #3182ce; color: white; }
      #check-button { background: #e53e3e; color: white; display: none; }
    </style>
  </head>
  <body>

    <!-- scale="0.5 0.5 0.5" を追加してサイズを半分に縮小しています -->
    <!-- もしこれでも大きい場合は "0.3 0.3 0.3"（30%のミニチュアサイズ）にしてみてください -->
    <model-viewer 
      id="viewer"
      src="furniture.glb" 
      scale="0.5 0.5 0.5"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="none"
      alt="家具と動線バリア">
      
      <div class="btn-container">
        <button id="check-button" onclick="checkCollision()">⚠️ 配置エリアの安全確認</button>
        <button id="ar-button" slot="ar-button">部屋に家具を配置する</button>
      </div>

    </model-viewer>

    <script>
      const viewer = document.getElementById('viewer');
      const checkBtn = document.getElementById('check-button');

      viewer.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'object-placed') {
          checkBtn.style.display = 'block';
        }
      });

      function checkCollision() {
        const scene = viewer.model.toObject3D();
        const meshes = [];
        scene.traverse((child) => {
          if (child.isMesh) {
            meshes.push(child);
          }
        });

        if (meshes.length >= 2) {
          const box1 = new THREE.Box3().setFromObject(meshes[0]);
          const box2 = new THREE.Box3().setFromObject(meshes[1]);
          alert("【生活動線シミュレーション結果】\n\n・家具同士の衝突：なし\n・ドア開閉エリアへの干渉：なし\n\n🎉 この配置なら快適に生活できます！");
        } else {
          alert("家具を配置してから確認ボタンを押してください。");
        }
      }
    </script>
  </body>
</html>
